<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="use-iframe" content="true">
  <meta name="html-box-height-mode" content="auto">
  <meta name="description" content="双周预设进度：8 款当前效果总览与线上旧效果对比">
  <title>预设效果进度</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #fff;
      --text: #171717;
      --secondary: #707075;
      --tertiary: #98989d;
      --line: rgba(20, 20, 20, 0.09);
      --muted: #f4f4f3;
      --active: #171717;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      margin: 0;
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--canvas);
    }

    body {
      color: var(--text);
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }

    .topbar,
    main {
      width: min(100%, 1440px);
      margin-inline: auto;
    }

    .topbar {
      width: 100%;
      height: 51px;
      padding: 8px 16px 7px;
      display: grid;
      grid-template-columns: minmax(120px, 1fr) auto minmax(120px, 1fr);
      align-items: center;
      gap: 14px;
    }

    h1,
    h2,
    p { margin: 0; }

    h1 {
      font-size: 16px;
      line-height: 1.2;
      font-weight: 680;
      letter-spacing: 0;
    }

    .tabs {
      display: inline-grid;
      grid-template-columns: repeat(2, 1fr);
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--muted);
    }

    .tab {
      min-height: 30px;
      padding: 0 14px;
      border: 0;
      border-radius: 4px;
      color: var(--secondary);
      background: transparent;
      font-size: 12px;
      font-weight: 620;
      cursor: pointer;
    }

    .tab[aria-selected="true"] {
      color: #fff;
      background: var(--active);
    }

    .original-button {
      justify-self: end;
      min-height: 34px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      background: #fff;
      font-size: 12px;
      font-weight: 620;
      cursor: pointer;
      touch-action: manipulation;
    }

    .original-button[hidden] { display: none; }

    .page[hidden] { display: none; }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border-top: 1px solid var(--line);
    }

    .preset {
      min-width: 0;
      padding: 14px 14px 12px;
    }

    .preset:not(:nth-child(4n + 1)) { border-left: 1px solid var(--line); }

    .sample-pair {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .sample-pair .media { aspect-ratio: 3 / 4; }

    .media {
      position: relative;
      min-width: 0;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      border-radius: 5px;
      background: var(--muted);
    }

    .media img {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
      pointer-events: none;
    }

    .media .original {
      opacity: 0;
      transition: opacity 120ms ease-out;
    }

    .media[data-state="original"] .original { opacity: 1; }

    .placeholder {
      display: grid;
      place-items: center;
      padding: 8px;
      border: 1px dashed rgba(20, 20, 20, 0.16);
      color: var(--tertiary);
      font-size: 10px;
      line-height: 1.35;
      text-align: center;
    }

    .preset-copy {
      margin-top: 9px;
      text-align: center;
    }

    .preset-copy h2 {
      font-size: 13px;
      line-height: 1.3;
      font-weight: 680;
      letter-spacing: 0;
    }

    .preset-copy p {
      margin-top: 2px;
      color: var(--secondary);
      font-size: 10px;
      line-height: 1.4;
    }

    .comparison-grid {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: repeat(2, minmax(0, 1fr));
      border-top: 1px solid var(--line);
    }

    .compare-preset {
      min-width: 0;
      padding: 13px 14px 12px;
    }

    .compare-heading {
      margin-bottom: 8px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .compare-heading h2 {
      font-size: 13px;
      line-height: 1.3;
      font-weight: 680;
    }

    .compare-heading p {
      overflow: hidden;
      color: var(--secondary);
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .scene-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }

    .scene {
      min-width: 0;
    }

    .scene + .scene {
      padding-left: 24px;
      border-left: 1px solid var(--line);
    }

    .scene-label {
      margin-bottom: 5px;
      color: var(--secondary);
      font-size: 10px;
      font-weight: 620;
    }

    .scene-states {
      display: grid;
      grid-template-columns: repeat(var(--state-count), minmax(0, 1fr));
      gap: 6px;
    }

    .scene-states[data-state-count="3"] {
      grid-template-columns: repeat(3, calc((100% - 18px) / 4));
      justify-content: center;
    }

    .state-card { min-width: 0; }

    .state-label {
      margin-bottom: 4px;
      overflow: hidden;
      color: var(--secondary);
      font-size: 10px;
      line-height: 1.25;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .state-card .media {
      aspect-ratio: 3 / 4;
      border-radius: 4px;
    }

    .tab:focus-visible,
    .original-button:focus-visible,
    .overview-sample:focus-visible,
    .comparison-sample:focus-visible {
      outline: 2px solid var(--active);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>预设效果进度</h1>
    <div class="tabs" role="tablist" aria-label="展示模式">
      <button class="tab" type="button" role="tab" aria-selected="true" data-page="overview">新增效果</button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-page="comparison">新旧对比</button>
    </div>
    <button class="original-button" type="button" aria-pressed="false">按住看原图</button>
  </header>

  <main>
    <section class="page" id="overview" aria-label="8 款新增效果">
      <div class="overview-grid" id="overview-grid"></div>
    </section>

    <section class="page" id="comparison" aria-label="线上旧效果与当前效果对比" hidden>
      <div class="comparison-grid" id="comparison-grid"></div>
    </section>
  </main>

  <script>
    const presets = [
      {
        name: 'Kodak FunSaver',
        traits: '微糊 / 边缘色散 / 时间戳 / 暗角 / 暖调',
        current: ['assets-web-hq/kodak-current-1.webp', 'assets-web-hq/kodak-current-2.webp'],
        original: ['assets-web-hq/kodak-original-1.webp', 'assets-web-hq/kodak-original-2.webp'],
        legacy: [null, null],
      },
      {
        name: 'Fuji NC',
        traits: '暖调 / 饱和色彩 / 暖肤色 / 阳光感',
        current: ['assets-web-hq/nc-current-1.webp', 'assets-web-hq/nc-current-2.webp'],
        original: ['assets-web-hq/nc-original-1.webp', 'assets-web-hq/nc-original-2.webp'],
        legacy: [null, null],
      },
      {
        name: 'Fuji Provia 100F',
        traits: '蓝紫色调 / 浓郁色彩 / 漏光 / 胶片感',
        current: ['assets-web-hq/provia-current-1.webp', 'assets-web-hq/provia-current-2.webp'],
        original: ['assets-web-hq/provia-original-1.webp', 'assets-web-hq/provia-original-2.webp'],
        legacy: [null, null],
      },
      {
        name: 'Casio CCD',
        traits: '冷调 / 柔光 / 轻微 CCD 质感 / 轻锐化',
        current: ['assets-web-hq/ccd-current-1.webp', 'assets-web-hq/ccd-current-2.webp'],
        original: ['assets-web-hq/ccd-original-1.webp', 'assets-web-hq/ccd-original-2.webp'],
        legacy: [null, null],
      },
      {
        name: 'Ricoh GRⅡ',
        traits: '冷调青蓝 / 柔和反差 / 清透低饱和',
        current: ['assets-web-hq/ricoh-current-1.webp', 'assets-web-hq/ricoh-current-2.webp'],
        original: ['assets-web-hq/ricoh-original-1.webp', 'assets-web-hq/ricoh-original-2.webp'],
        legacy: [null, null],
      },
      {
        name: '暗调',
        traits: '压低曝光 / 提高反差 / 压暗背景 / 轻噪点',
        current: ['assets-web-hq/dark-current-1.webp', 'assets-web-hq/dark-current-2.webp'],
        original: ['assets-web-hq/dark-original-1.webp', 'assets-web-hq/dark-original-2.webp'],
        legacy: [null, null],
      },
      {
        name: '浓郁',
        traits: '暖色温 / 高饱和 / 色彩饱满',
        current: ['assets-web-hq/vivid-current-1.webp', 'assets-web-hq/vivid-current-2.webp'],
        original: ['assets-web-hq/vivid-original-1.webp', 'assets-web-hq/vivid-original-2.webp'],
        legacy: [null, null],
      },
      {
        name: '黑白',
        traits: '中性黑白 / 高反差 / 突出明暗结构',
        current: ['assets-web-hq/mono-current-1.webp', 'assets-web-hq/mono-current-2.webp'],
        original: ['assets-web-hq/mono-original-1.webp', 'assets-web-hq/mono-original-2.webp'],
        legacy: [null, null],
      },
    ];

    const overviewGrid = document.querySelector('#overview-grid');
    const comparisonGrid = document.querySelector('#comparison-grid');
    const originalButton = document.querySelector('.original-button');

    function imageMarkup(src, className, alt) {
      return src ? `<img class="${className}" src="${src}" alt="${alt}">` : '';
    }

    function overviewSample(preset, index) {
      const current = preset.current[index];
      const original = preset.original[index];
      if (!current || !original) {
        return '<div class="media placeholder">待补当前效果</div>';
      }
      return `
        <div class="media overview-sample" data-state="current" tabindex="0" role="button" aria-label="${preset.name} 样片 ${index + 1}，按住查看原图">
          ${imageMarkup(current, 'current', `${preset.name} 当前效果 ${index + 1}`)}
          ${imageMarkup(original, 'original', `${preset.name} 原图 ${index + 1}`)}
        </div>`;
    }

    presets.forEach((preset) => {
      overviewGrid.insertAdjacentHTML('beforeend', `
        <article class="preset">
          <div class="sample-pair">
            ${overviewSample(preset, 0)}
            ${overviewSample(preset, 1)}
          </div>
          <div class="preset-copy">
            <h2>${preset.name}</h2>
            <p>${preset.traits}</p>
          </div>
        </article>`);
    });

    const presetByName = Object.fromEntries(presets.map((preset) => [preset.name, preset]));
    const comparisonSections = [
      {
        name: '相机胶卷系',
        hideSceneLabels: true,
        scenes: [
          {
            label: '图 A',
            original: 'assets-web-hq/compare-a-original.webp',
            states: [
              { label: '线上Kodak', image: 'assets-web-hq/compare-a-kodak-legacy.webp' },
              { label: '🆕 新Kodak FunSaver', image: 'assets-web-hq/compare-a-kodak-current.webp' },
              { label: '线上Fuji', image: 'assets-web-hq/compare-a-fuji-legacy.webp' },
              { label: '🆕 新Fuji NC', image: 'assets-web-hq/compare-a-fuji-nc-current.webp' },
            ],
          },
          {
            label: '图 B',
            original: 'assets-web-hq/compare-b-original.webp',
            states: [
              { label: '线上Kodak', image: 'assets-web-hq/compare-b-kodak-legacy.webp' },
              { label: '🆕 新Kodak FunSaver', image: 'assets-web-hq/compare-b-kodak-current.webp' },
              { label: '线上Fuji', image: 'assets-web-hq/compare-b-fuji-legacy.webp' },
              { label: '🆕 新 Fuji Provia 100F', image: 'assets-web-hq/compare-b-fuji-current.webp' },
            ],
          },
        ],
      },
      {
        name: '日常系',
        hideSceneLabels: true,
        scenes: [
          {
            label: '图 C · 黑白',
            original: 'assets-web-hq/compare-c-original.webp',
            states: [
              { label: '线上Darkroom', image: 'assets-web-hq/compare-c-darkroom-legacy.webp' },
              { label: '线上Mirage', image: 'assets-web-hq/compare-c-mirage-legacy.webp' },
              { label: '线上Mono', image: 'assets-web-hq/compare-c-online-mono.webp' },
              { label: '🆕 新黑白', image: 'assets-web-hq/compare-c-mono-current.webp' },
            ],
          },
          {
            label: '图 D · 暗调',
            original: 'assets-web-hq/compare-d-original.webp',
            states: [
              { label: '线上Gotham', image: 'assets-web-hq/compare-d-gotham-legacy.webp' },
              { label: '线上Teal', image: 'assets-web-hq/compare-d-teal-legacy.webp' },
              { label: '线上Steel', image: 'assets-web-hq/compare-d-steel-legacy.webp' },
              { label: '🆕 新暗调', image: 'assets-web-hq/compare-d-dark-current.webp' },
            ],
          },
        ],
      },
    ];

    function comparisonState(state, original, sectionName, sceneLabel) {
      const media = state.image
        ? `<div class="media comparison-sample" data-state="current" tabindex="0" role="button" aria-label="${sectionName} ${sceneLabel} ${state.label}，按住查看原图">
            ${imageMarkup(state.image, 'current', `${sectionName} ${sceneLabel} ${state.label}`)}
            ${imageMarkup(original, 'original', `${sectionName} ${sceneLabel} 原图`)}
          </div>`
        : `<div class="media placeholder">待补${state.label}</div>`;
      return `<div class="state-card"><div class="state-label">${state.label}</div>${media}</div>`;
    }

    comparisonSections.forEach((section) => {
      const scenes = section.scenes.map((scene) => {
        const states = scene.states.map((state) => comparisonState(state, scene.original, section.name, scene.label)).join('');
        const sceneLabel = section.hideSceneLabels ? '' : `<div class="scene-label">${scene.label}</div>`;
        return `
          <section class="scene" aria-label="${section.name} ${scene.label}">
            ${sceneLabel}
            <div class="scene-states" data-state-count="${scene.states.length}" style="--state-count: ${scene.states.length}">${states}</div>
          </section>`;
      }).join('');

      comparisonGrid.insertAdjacentHTML('beforeend', `
        <article class="compare-preset">
          <div class="compare-heading">
            <h2>${section.name}</h2>
          </div>
          <div class="scene-grid">${scenes}</div>
        </article>`);
    });

    const overviewSamples = [...document.querySelectorAll('.overview-sample')];
    const comparisonSamples = [...document.querySelectorAll('.comparison-sample')];

    function setOriginalState(state) {
      [...overviewSamples, ...comparisonSamples].forEach((sample) => { sample.dataset.state = state; });
      originalButton.setAttribute('aria-pressed', String(state === 'original'));
    }

    function bindPress(target, onStart, onEnd) {
      target.addEventListener('pointerdown', (event) => {
        if (event.pointerType === 'mouse' && event.button !== 0) return;
        target.setPointerCapture?.(event.pointerId);
        onStart();
      });
      ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((name) => target.addEventListener(name, onEnd));
      target.addEventListener('keydown', (event) => {
        if ((event.key === ' ' || event.key === 'Enter') && !event.repeat) {
          event.preventDefault();
          onStart();
        }
      });
      target.addEventListener('keyup', (event) => {
        if (event.key === ' ' || event.key === 'Enter') {
          event.preventDefault();
          onEnd();
        }
      });
      target.addEventListener('contextmenu', (event) => event.preventDefault());
    }

    bindPress(originalButton, () => setOriginalState('original'), () => setOriginalState('current'));
    overviewSamples.forEach((sample) => bindPress(
      sample,
      () => { sample.dataset.state = 'original'; },
      () => { sample.dataset.state = 'current'; },
    ));
    comparisonSamples.forEach((sample) => bindPress(
      sample,
      () => { sample.dataset.state = 'original'; },
      () => { sample.dataset.state = 'current'; },
    ));

    document.querySelectorAll('.tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        const pageId = tab.dataset.page;
        document.querySelectorAll('.tab').forEach((item) => item.setAttribute('aria-selected', String(item === tab)));
        document.querySelectorAll('.page').forEach((page) => { page.hidden = page.id !== pageId; });
        setOriginalState('current');
      });
    });
  </script>
</body>
</html>
