<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="use-iframe" content="true">
  <meta name="html-box-height-mode" content="auto">
  <meta name="description" content="双周预设进度：15 款当前效果总览与线上旧效果对比">
  <title>预设效果进度</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #fff;
      --text: #171717;
      --secondary: #707075;
      --tertiary: #98989d;
      --line: rgba(20, 20, 20, 0.09);
      --muted: #f4f4f3;
      --active: #171717;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      margin: 0;
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--canvas);
    }

    body {
      color: var(--text);
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }

    .topbar,
    main {
      width: min(100%, 1440px);
      margin-inline: auto;
    }

    .topbar {
      width: 100%;
      height: 51px;
      padding: 8px 16px 7px;
      display: grid;
      grid-template-columns: minmax(120px, 1fr) auto minmax(120px, 1fr);
      align-items: center;
      gap: 14px;
    }

    h1,
    h2,
    p { margin: 0; }

    h1 {
      font-size: 16px;
      line-height: 1.2;
      font-weight: 680;
      letter-spacing: 0;
    }

    .tabs {
      display: inline-grid;
      grid-template-columns: repeat(2, 1fr);
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--muted);
    }

    .tab {
      min-height: 30px;
      padding: 0 14px;
      border: 0;
      border-radius: 4px;
      color: var(--secondary);
      background: transparent;
      font-size: 12px;
      font-weight: 620;
      cursor: pointer;
    }

    .tab[aria-selected="true"] {
      color: #fff;
      background: var(--active);
    }

    .original-button {
      justify-self: end;
      min-height: 34px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      background: #fff;
      font-size: 12px;
      font-weight: 620;
      cursor: pointer;
      touch-action: manipulation;
    }

    .original-button[hidden] { display: none; }

    .page[hidden] { display: none; }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border-top: 1px solid var(--line);
    }

    .preset {
      min-width: 0;
      padding: 14px 14px 12px;
    }

    .preset:not(:nth-child(3n + 1)) { border-left: 1px solid var(--line); }

    .sample-pair {
      display: grid;
      width: 100%;
      max-width: 300px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      margin-inline: auto;
    }

    .sample-pair .media { aspect-ratio: 3 / 4; }

    .media {
      position: relative;
      min-width: 0;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      border-radius: 5px;
      background: var(--muted);
    }

    .media img {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
      pointer-events: none;
    }

    .overview-sample {
      cursor: zoom-in;
      transition: outline-color 120ms ease-out;
    }

    .sample-pair:hover .overview-sample {
      outline: 1px solid rgba(20, 20, 20, 0.18);
      outline-offset: -1px;
    }

    .media .original {
      opacity: 0;
      transition: opacity 120ms ease-out;
    }

    .media[data-state="original"] .original { opacity: 1; }

    .placeholder {
      display: grid;
      place-items: center;
      padding: 8px;
      border: 1px dashed rgba(20, 20, 20, 0.16);
      color: var(--tertiary);
      font-size: 10px;
      line-height: 1.35;
      text-align: center;
    }

    .preset-copy {
      margin-top: 9px;
      text-align: center;
    }

    .preset-heading {
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .preset-copy h2 {
      font-size: 13px;
      line-height: 1.3;
      font-weight: 680;
      letter-spacing: 0;
    }

    .preset-title {
      position: relative;
      display: inline-block;
    }

    .preset-name {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: help;
      outline: none;
    }

    .preset-info {
      display: inline-grid;
      width: 12px;
      height: 12px;
      place-items: center;
      border: 1px solid rgba(23, 23, 23, 0.24);
      border-radius: 50%;
      color: var(--tertiary);
      font-size: 8px;
      font-style: normal;
      font-weight: 700;
      line-height: 1;
    }

    .preset-tooltip {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 8px);
      z-index: 10;
      width: max-content;
      max-width: min(250px, calc(100vw - 24px));
      padding: 7px 9px;
      border-radius: 5px;
      color: #fff;
      background: rgba(23, 23, 23, 0.94);
      font-size: 10px;
      font-weight: 450;
      line-height: 1.45;
      text-align: left;
      text-decoration: none;
      transform: translate(-50%, 4px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 120ms ease-out, transform 120ms ease-out, visibility 120ms;
    }

    .preset-tooltip::after {
      position: absolute;
      top: 100%;
      left: 50%;
      width: 0;
      height: 0;
      border: 5px solid transparent;
      border-top-color: rgba(23, 23, 23, 0.94);
      content: '';
      transform: translateX(-50%);
    }

    .preset-title:hover .preset-tooltip,
    .preset-title:focus-within .preset-tooltip {
      transform: translate(-50%, 0);
      opacity: 1;
      visibility: visible;
    }

    .preset-copy p {
      display: flex;
      min-height: 28px;
      align-items: flex-start;
      justify-content: center;
      margin-top: 2px;
      color: var(--secondary);
      font-size: 10px;
      line-height: 1.4;
    }

    .comparison-grid {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: repeat(4, minmax(0, 1fr));
      border-top: 1px solid var(--line);
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      padding: 16px;
      place-items: center;
      background: rgba(255, 255, 255, 0.97);
    }

    .lightbox[hidden] { display: none; }

    .lightbox-dialog {
      display: grid;
      width: min(780px, 100%);
      max-height: 100%;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
    }

    .lightbox-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
    }

    .lightbox-header h2 {
      overflow: hidden;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lightbox-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .lightbox-original,
    .lightbox-close {
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--text);
      background: #fff;
      font: inherit;
      font-size: 11px;
      font-weight: 650;
      cursor: pointer;
    }

    .lightbox-original { padding: 0 10px; }

    .lightbox-close {
      width: 30px;
      padding: 0;
      font-size: 18px;
      font-weight: 400;
      line-height: 1;
    }

    .lightbox-grid {
      display: grid;
      min-height: 0;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: center;
      gap: 12px;
    }

    .lightbox-media {
      width: min(100%, calc((100vh - 104px) * 0.75));
      max-width: 100%;
      height: auto;
      justify-self: center;
      aspect-ratio: 3 / 4;
      border-radius: 6px;
    }

    body.lightbox-open { overflow: hidden; }

    .compare-preset {
      display: grid;
      min-width: 0;
      min-height: 0;
      grid-template-columns: clamp(72px, 12vw, 118px) minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
    }

    .compare-heading {
      min-width: 0;
      display: flex;
      align-items: baseline;
    }

    .compare-heading h2 {
      font-size: 13px;
      line-height: 1.3;
      font-weight: 680;
    }

    .compare-heading p {
      overflow: hidden;
      color: var(--secondary);
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .compare-preset.grouped-scenes { grid-row: span 2; }

    .grouped-scenes + .compare-preset { border-top: 1px solid var(--line); }

    .scene-grid {
      display: grid;
      width: min(100%, 560px);
      min-height: 0;
      grid-template-columns: minmax(0, 1fr);
      align-items: center;
      justify-self: center;
    }

    .scene {
      min-width: 0;
      min-height: 0;
    }

    .grouped-scenes .scene-grid {
      grid-template-rows: repeat(2, auto);
      row-gap: 10px;
    }

    .scene-label {
      margin-bottom: 5px;
      color: var(--secondary);
      font-size: 10px;
      font-weight: 620;
    }

    .scene-states {
      display: grid;
      min-height: 0;
      grid-template-columns: repeat(var(--state-count), minmax(0, 1fr));
      align-items: start;
      gap: 6px;
    }

    .scene-states.has-new-divider {
      grid-template-columns:
        repeat(var(--legacy-count), minmax(0, 1fr))
        0
        repeat(var(--new-count), minmax(0, 1fr));
    }

    .effect-group-gap {
      width: 0;
      min-width: 0;
    }

    .scene-states[data-state-count="3"] {
      grid-template-columns: repeat(3, calc((100% - 18px) / 4));
      justify-content: center;
    }

    .state-card {
      display: grid;
      min-width: 0;
      min-height: 0;
      grid-template-rows: auto auto;
      justify-items: center;
    }

    .state-label {
      margin-bottom: 4px;
      overflow: hidden;
      color: var(--secondary);
      font-size: 10px;
      line-height: 1.25;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .state-card .media {
      width: min(100%, 110px);
      height: auto;
      max-width: 100%;
      aspect-ratio: 3 / 4;
      border-radius: 4px;
    }

    .tab:focus-visible,
    .original-button:focus-visible,
    .lightbox-original:focus-visible,
    .lightbox-close:focus-visible,
    .overview-sample:focus-visible,
    .comparison-sample:focus-visible {
      outline: 2px solid var(--active);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>预设效果进度</h1>
    <div class="tabs" role="tablist" aria-label="展示模式">
      <button class="tab" type="button" role="tab" aria-selected="true" data-page="overview">新增效果</button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-page="comparison">新旧对比</button>
    </div>
    <button class="original-button" type="button" aria-pressed="false">按住看原图</button>
  </header>

  <main>
    <section class="page" id="overview" aria-label="15 款新增效果">
      <div class="overview-grid" id="overview-grid"></div>
    </section>

    <section class="page" id="comparison" aria-label="线上旧效果与当前效果对比" hidden>
      <div class="comparison-grid" id="comparison-grid"></div>
    </section>
  </main>

  <div class="lightbox" id="preset-lightbox" hidden>
    <section class="lightbox-dialog" role="dialog" aria-modal="true" aria-labelledby="lightbox-title">
      <div class="lightbox-header">
        <h2 id="lightbox-title"></h2>
        <div class="lightbox-actions">
          <button class="lightbox-original" type="button" aria-pressed="false">按住看原图</button>
          <button class="lightbox-close" type="button" aria-label="关闭大图" title="关闭">×</button>
        </div>
      </div>
      <div class="lightbox-grid" id="lightbox-grid"></div>
    </section>
  </div>

    const comparisonGrid = document.querySelector('#comparison-grid');
    const originalButton = document.querySelector('.original-button');
    const lightbox = document.querySelector('#preset-lightbox');
    const lightboxTitle = document.querySelector('#lightbox-title');
    const lightboxGrid = document.querySelector('#lightbox-grid');
    const lightboxOriginalButton = document.querySelector('.lightbox-original');
    const lightboxCloseButton = document.querySelector('.lightbox-close');
    let lightboxSamples = [];
    let lightboxTrigger = null;

    function imageMarkup(src, className, alt) {
      return src ? `<img class="${className}" src="${src}" alt="${alt}">` : '';
    }

    function overviewSample(preset, index, presetIndex) {
      const current = preset.current[index];
      const original = preset.original[index];
      if (!current || !original) {
        return '<div class="media placeholder">待补当前效果</div>';
      }
      return `
        <div class="media overview-sample" data-state="current" data-preset-index="${presetIndex}" tabindex="0" role="button" title="点击查看两张大图；按住查看原图" aria-label="${preset.name} 样片 ${index + 1}，单击查看两张大图，按住查看原图">
          ${imageMarkup(current, 'current', `${preset.name} 当前效果 ${index + 1}`)}
          ${imageMarkup(original, 'original', `${preset.name} 原图 ${index + 1}`)}
        </div>`;
    }

    presets.filter((preset) => !preset.hiddenInOverview).forEach((preset) => {
      const presetIndex = presets.indexOf(preset);
      const descriptionId = `preset-description-${presetIndex}`;
      overviewGrid.insertAdjacentHTML('beforeend', `
        <article class="preset">
          <div class="sample-pair">
            ${overviewSample(preset, 0, presetIndex)}
            ${overviewSample(preset, 1, presetIndex)}
          </div>
          <div class="preset-copy">
            <div class="preset-heading">
              <div class="preset-title">
                <h2 class="preset-name" tabindex="0" aria-describedby="${descriptionId}">${preset.name}<span class="preset-info" aria-hidden="true">i</span></h2>
                <div class="preset-tooltip" id="${descriptionId}" role="tooltip">${preset.description}</div>
              </div>
            </div>
            <p>${preset.traits}</p>
          </div>
        </article>`);
    });

    const presetByName = Object.fromEntries(presets.map((preset) => [preset.name, preset]));
    const comparisonSections = [
      {
        name: '相机胶卷系',
        hideSceneLabels: true,
        scenes: [
          {
            label: '图 A',
            original: 'assets-web-hq/compare-a-original.webp',
            states: [
              { label: '线上Kodak', image: 'assets-web-hq/compare-a-kodak-legacy.webp' },
              { label: '线上Fuji', image: 'assets-web-hq/compare-a-fuji-legacy.webp' },
              { label: '🆕 新Kodak FunSaver', image: 'assets-web-hq/compare-a-kodak-current.webp' },
              { label: '🆕 新Fuji X100V NC', image: 'assets-web-hq/compare-a-fuji-nc-current.webp' },
              { label: '🆕 新Fuji Provia 100F', image: 'assets-web-hq/compare-a-fuji-provia-current.webp' },
            ],
          },
          {
            label: '图 B',
            hideStateLabels: true,
            original: 'assets-web-hq/compare-b-original.webp',
            states: [
              { label: '线上Kodak', image: 'assets-web-hq/compare-b-kodak-legacy.webp' },
              { label: '线上Fuji', image: 'assets-web-hq/compare-b-fuji-legacy.webp' },
              { label: '🆕 新Kodak FunSaver', image: 'assets-web-hq/compare-b-kodak-current.webp' },
              { label: '🆕 新Fuji X100V NC', image: 'assets-web-hq/compare-b-fuji-nc-current.webp' },
              { label: '🆕 新Fuji Provia 100F', image: 'assets-web-hq/compare-b-fuji-current.webp' },
            ],
          },
        ],
      },
      {
        name: '黑白系',
        hideSceneLabels: true,
        scenes: [
          {
            label: '图 C · B&W',
            original: 'assets-web-hq/compare-c-original.webp',
            states: [
              { label: '线上Darkroom', image: 'assets-web-hq/compare-c-darkroom-legacy.webp' },
              { label: '线上Mirage', image: 'assets-web-hq/compare-c-mirage-legacy.webp' },
              { label: '线上Mono', image: 'assets-web-hq/compare-c-online-mono.webp' },
              { label: '线上Old Movie', image: 'assets-web-hq/compare-c-oldmovie-legacy.webp' },
              { label: '🆕 新B&W', image: 'assets-web-hq/compare-c-mono-current.webp' },
            ],
          },
        ],
      },
      {
        name: '暗调系',
        hideSceneLabels: true,
        scenes: [
          {
            label: '图 D · Moody',
            original: 'assets-web-hq/compare-d-original.webp',
            states: [
              { label: '线上Gotham', image: 'assets-web-hq/compare-d-gotham-legacy.webp' },
              { label: '线上Teal', image: 'assets-web-hq/compare-d-teal-legacy.webp' },
              { label: '线上Gothic', image: 'assets-web-hq/compare-d-gothic-legacy.webp' },
              { label: '线上Steel', image: 'assets-web-hq/compare-d-steel-legacy.webp' },
              { label: '🆕 新Moody', image: 'assets-web-hq/compare-d-dark-current.webp' },
            ],
          },
        ],
      },
    ];

    function comparisonState(state, original, sectionName, sceneLabel, hideLabel = false) {
      const media = state.image
        ? `<div class="media comparison-sample" data-state="current" tabindex="0" role="button" aria-label="${sectionName} ${sceneLabel} ${state.label}，按住查看原图">
            ${imageMarkup(state.image, 'current', `${sectionName} ${sceneLabel} ${state.label}`)}
            ${imageMarkup(original, 'original', `${sectionName} ${sceneLabel} 原图`)}
          </div>`
        : `<div class="media placeholder">待补${state.label}</div>`;
      const label = hideLabel ? '' : `<div class="state-label">${state.label}</div>`;
      return `<div class="state-card">${label}${media}</div>`;
    }

    comparisonSections.forEach((section) => {
      const scenes = section.scenes.map((scene) => {
        const groupName = scene.groupName || section.name;
        const firstNewIndex = scene.states.findIndex((state) => state.label.startsWith('🆕'));
        const hasNewDivider = firstNewIndex > 0;
        const states = scene.states.map((state, index) => {
          const divider = hasNewDivider && index === firstNewIndex ? '<div class="effect-group-gap" aria-hidden="true"></div>' : '';
          return divider + comparisonState(state, scene.original, groupName, scene.label, scene.hideStateLabels);
        }).join('');
        const stateGridClass = hasNewDivider ? ' has-new-divider' : '';
        const stateGridStyle = hasNewDivider
          ? `--state-count: ${scene.states.length}; --legacy-count: ${firstNewIndex}; --new-count: ${scene.states.length - firstNewIndex}`
          : `--state-count: ${scene.states.length}`;
        const groupHeading = scene.groupName ? `<div class="compare-heading"><h2>${scene.groupName}</h2></div>` : '';
        const sceneLabel = section.hideSceneLabels ? '' : `<div class="scene-label">${scene.label}</div>`;
        return `
          <section class="scene" aria-label="${groupName} ${scene.label}">
            ${groupHeading}
            ${sceneLabel}
            <div class="scene-states${stateGridClass}" data-state-count="${scene.states.length}" style="${stateGridStyle}">${states}</div>
          </section>`;
      }).join('');

      const sectionHeading = section.name ? `
          <div class="compare-heading">
            <h2>${section.name}</h2>
          </div>` : '';
      const groupedClass = section.scenes.length > 1 ? ' grouped-scenes' : '';

      comparisonGrid.insertAdjacentHTML('beforeend', `
        <article class="compare-preset${groupedClass}">
          ${sectionHeading}
          <div class="scene-grid">${scenes}</div>
        </article>`);
    });

    let syncedOverviewHeight = 0;

    function syncPageHeights() {
      const nextHeight = Math.ceil(overviewGrid.getBoundingClientRect().height);
      if (nextHeight <= 0 || nextHeight === syncedOverviewHeight) return;
      syncedOverviewHeight = nextHeight;
      comparisonGrid.style.height = `${syncedOverviewHeight}px`;
    }

    requestAnimationFrame(syncPageHeights);
    new ResizeObserver(syncPageHeights).observe(overviewGrid);

    const overviewSamples = [...document.querySelectorAll('.overview-sample')];
    const comparisonSamples = [...document.querySelectorAll('.comparison-sample')];

    function setOriginalState(state) {
      [...overviewSamples, ...comparisonSamples].forEach((sample) => { sample.dataset.state = state; });
      originalButton.setAttribute('aria-pressed', String(state === 'original'));
    }

    function setLightboxOriginalState(state) {
      lightboxSamples.forEach((sample) => { sample.dataset.state = state; });
      lightboxOriginalButton.setAttribute('aria-pressed', String(state === 'original'));
    }

    function openLightbox(presetIndex, trigger) {
      const preset = presets[presetIndex];
      if (!preset) return;
      lightboxTitle.textContent = preset.name;
      lightboxGrid.innerHTML = preset.current.map((current, index) => `
        <div class="media lightbox-media" data-state="current" tabindex="0" role="button" aria-label="${preset.name} 大图 ${index + 1}，按住查看原图">
          ${imageMarkup(current, 'current', `${preset.name} 当前效果大图 ${index + 1}`)}
          ${imageMarkup(preset.original[index], 'original', `${preset.name} 原图大图 ${index + 1}`)}
        </div>`).join('');
      lightboxSamples = [...lightboxGrid.querySelectorAll('.lightbox-media')];
      lightboxSamples.forEach((sample) => bindPress(
        sample,
        () => { sample.dataset.state = 'original'; },
        () => { sample.dataset.state = 'current'; },
      ));
      lightboxTrigger = trigger;
      setLightboxOriginalState('current');
      lightbox.hidden = false;
      document.body.classList.add('lightbox-open');
      lightboxCloseButton.focus();
    }

    function closeLightbox() {
      lightbox.hidden = true;
      document.body.classList.remove('lightbox-open');
      lightboxGrid.replaceChildren();
      lightboxSamples = [];
      lightboxTrigger?.focus();
      lightboxTrigger = null;
    }

    function bindPress(target, onStart, onEnd) {
      target.addEventListener('pointerdown', (event) => {
        if (event.pointerType === 'mouse' && event.button !== 0) return;
        target.setPointerCapture?.(event.pointerId);
        onStart();
      });
      ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((name) => target.addEventListener(name, onEnd));
      target.addEventListener('keydown', (event) => {
        if ((event.key === ' ' || event.key === 'Enter') && !event.repeat) {
          event.preventDefault();
          onStart();
        }
      });
      target.addEventListener('keyup', (event) => {
        if (event.key === ' ' || event.key === 'Enter') {
          event.preventDefault();
          onEnd();
        }
      });
      target.addEventListener('contextmenu', (event) => event.preventDefault());
    }

    bindPress(originalButton, () => setOriginalState('original'), () => setOriginalState('current'));
    bindPress(lightboxOriginalButton, () => setLightboxOriginalState('original'), () => setLightboxOriginalState('current'));
    overviewSamples.forEach((sample) => {
      let pressedAt = 0;
      let pressedPoint = null;
      bindPress(
        sample,
        () => { sample.dataset.state = 'original'; },
        () => { sample.dataset.state = 'current'; },
      );
      sample.addEventListener('pointerdown', (event) => {
        pressedAt = performance.now();
        pressedPoint = { x: event.clientX, y: event.clientY };
      });
      sample.addEventListener('pointerup', (event) => {
        const duration = performance.now() - pressedAt;
        const distance = pressedPoint ? Math.hypot(event.clientX - pressedPoint.x, event.clientY - pressedPoint.y) : Infinity;
        if (duration < 260 && distance < 8) openLightbox(Number(sample.dataset.presetIndex), sample);
        pressedPoint = null;
      });
      sample.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.repeat) openLightbox(Number(sample.dataset.presetIndex), sample);
      });
    });
    comparisonSamples.forEach((sample) => bindPress(
      sample,
      () => { sample.dataset.state = 'original'; },
      () => { sample.dataset.state = 'current'; },
    ));

    lightboxCloseButton.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (event) => {
      if (event.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !lightbox.hidden) closeLightbox();
    });

    document.querySelectorAll('.tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        const pageId = tab.dataset.page;
        document.querySelectorAll('.tab').forEach((item) => item.setAttribute('aria-selected', String(item === tab)));
        document.querySelectorAll('.page').forEach((page) => { page.hidden = page.id !== pageId; });
        setOriginalState('current');
      });
    });
  </script>
</body>
</html>
